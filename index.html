<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Grazing Guru</title>
  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#87ceeb" />
</head>

<body>
  <main id="app-container">
    <header class="hud-header">
      <div class="milk-counter"><span id="milk-display">0</span> 🥛</div>
      <div class="mps-counter"><span id="mps-display">0</span> milk / sec</div>
    </header>

    <section class="stage">
      <button id="cow-clicker" class="cow-button" aria-label="Milk Cow">
        <svg class="cow-graphic" viewBox="0 0 100 100">
          <!-- Base Cow Graphic -->
          <ellipse cx="50" cy="55" rx="35" ry="25" fill="#f8f9fa" stroke="#333" stroke-width="3" />
          <circle cx="35" cy="50" r="10" fill="#212529" />
          <circle cx="65" cy="60" r="8" fill="#212529" />
          <ellipse cx="50" cy="72" rx="16" ry="10" fill="#ffb4a2" stroke="#333" stroke-width="2" />
          <circle cx="44" cy="72" r="2" fill="#333" />
          <circle cx="56" cy="72" r="2" fill="#333" />
          <circle cx="42" cy="42" r="3" fill="#000" />
          <circle cx="58" cy="42" r="3" fill="#000" />
          <polygon points="25,35 15,22 30,28" fill="#e9ecef" stroke="#333" stroke-width="2" />
          <polygon points="75,35 85,22 70,28" fill="#e9ecef" stroke="#333" stroke-width="2" />

          <!-- Dynamic Hat Mount Slot -->
          <g id="hat-slot"></g>
        </svg>
      </button>
    </section>

    <footer class="hud-footer">
      <button class="action-btn" id="btn-feed">Feed Clover (+1/s)</button>
      <button class="action-btn" id="btn-wardrobe">Wardrobe</button>
    </footer>

    <!-- Slide-Up Wardrobe Modal -->
    <div id="wardrobe-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Hat Boutique</h2>
          <button id="btn-close-modal" class="close-btn">&times;</button>
        </div>

        <!-- Monetization / Rewarded Ad Button -->
        <div class="ad-banner">
          <p>Need fast milk?</p>
          <button id="btn-ad-boost" class="ad-btn">📺 Watch Ad (+250 Milk)</button>
        </div>

        <div id="hats-list" class="hats-list"></div>
      </div>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
